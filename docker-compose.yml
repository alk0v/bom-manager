services:
  bommanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bommanager
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-3001}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-/media}
      - MEDIA_DIR=/app/media
      - DATA_DIR=/app/data
      # -------------------------------------------------------------------------
      # Database Configuration (inherited from .env, with SQLite as fallback)
      # -------------------------------------------------------------------------
      - DB_TYPE=${DB_TYPE:-sqlite}
      - SQLITE_FILE=/app/data/bommanager.sqlite
      - DEMO_DATA=${DEMO_DATA:-true}
      # External MySQL / MariaDB (used when DB_TYPE=mysql in .env)
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-}
    volumes:
      - ./data:/app/data
      - ./media:/app/media
